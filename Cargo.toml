[workspace]
members = ["grammar"]
# The Zed extension is a workspace of its own: Zed builds it for wasm32-wasip2
# inside editors/zed, and the registry may package that directory alone.
exclude = ["editors"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/radiosilence/zed-askama"
publish = false

[workspace.dependencies]
# The grammar's differential test holds it to askama's parser at the release
# vendor/askama-testing comes from; scripts/vendor-askama-testing.py names it.
askama_parser = { version = "=0.16.1", default-features = false, features = ["config"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
