# The Zed extension is the root package, so Zed's builder, which runs cargo in
# this directory for wasm32-wasip2, builds it alone; the grammar's crate is a
# member for its tests, never part of the extension.
[package]
name = "askama-zed"
description = "The Zed extension for Askama templates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"

[lints]
workspace = true

[workspace]
members = ["grammar"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/radiosilence/zed-askama"
publish = false

[workspace.dependencies]
# The grammar's differential test holds it to askama's parser at the release
# vendor/askama-testing comes from; scripts/vendor-askama-testing.py names it.
askama_parser = { version = "=0.16.1", default-features = false, features = ["config"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
