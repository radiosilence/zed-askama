# Askama templates whose content is Markdown. Zed picks the language whose suffix
# matches the longer part of the file name, so `page.md.askama` is Markdown
# although Askama HTML claims `askama`.
name = "Askama Markdown"
grammar = "askama"
block_comment = ["{# ", " #}"]
autoclose_before = ";:.,=}])>\"'"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "{%", end = " %", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "{{", end = " }", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "{#", end = " #", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
]
path_suffixes = ["md.askama", "md.rinja"]
