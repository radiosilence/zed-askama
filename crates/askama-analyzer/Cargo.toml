[package]
name = "askama-analyzer"
description = "A language server for askama templates that answers through rust-analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
askama-analyzer-codegen.workspace = true
askama_parser.workspace = true
async-lsp = { version = "0.2.4", default-features = false, features = ["client-monitor", "omni-trait", "stdio", "tokio", "tracing"] }
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
line-index = "0.1.2"
parking_lot = "0.13"
# The version async-lsp is built on, so one set of protocol types runs through both sides.
lsp-types = "0.95"
proc-macro2.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn.workspace = true
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower = { version = "0.5", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }

[lints]
workspace = true
