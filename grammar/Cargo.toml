[package]
name = "tree-sitter-askama"
description = "Tree-sitter grammar for Askama templates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "src/*", "tree-sitter.json"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
# The differential test holds the grammar to the parser release the analyser pins.
askama_parser.workspace = true
tree-sitter = "0.27"

# The workspace forbids `unsafe`; this crate's binding calls the generated C
# parser, so it denies `unsafe` instead and allows it only at that call.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
