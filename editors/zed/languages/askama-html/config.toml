# Askama templates whose content is HTML, XML or SVG. The `{{ … }}` and `{% … %}`
# brackets close with the `}` that typing `{` already inserted.
name = "Askama HTML"
grammar = "askama"
block_comment = ["{# ", " #}"]
autoclose_before = ";:.,=}])>\"'"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "{%", end = " %", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "{{", end = " }", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "{#", end = " #", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
]
path_suffixes = [
    "askama", "rinja",
    "html.askama", "htm.askama", "xml.askama", "svg.askama",
    "html.rinja", "htm.rinja", "xml.rinja", "svg.rinja",
]
