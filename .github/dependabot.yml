version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned exactly to the release vendor/askama-testing comes from; a new
      # askama release moves both (scripts/vendor-askama-testing.py).
      - dependency-name: askama_parser

  # Every action here is SHA-pinned, which is correct and also means they never
  # update themselves.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
