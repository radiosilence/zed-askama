name: CI/CD

# Two halves in one run, so the second ships what the first built.
#
# CI checks the change and ends in `Checks`, the one status the ruleset
# requires. Each job runs only for the domains the change touches (see
# `changes`); a skipped job passes `Checks`, a failed or cancelled one fails
# it, so jobs can be added, renamed or skipped without touching branch
# protection.
#
# CD releases when a push to main changes the workspace version (a merged
# release pull request, see docs/releasing.md). `askama-analyzer` is built for
# every platform alongside the checks, the macOS builds signed and notarised;
# once `Checks` and every build have passed, the archives are published as the
# GitHub release with checksums and provenance, and the version bump is opened
# on zed-industries/extensions as a draft.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub evicts a cache not read for 7 days, and this repository can go
  # quiet for longer. Building twice a week on main keeps the entries alive; a
  # scheduled run checks everything and delivers nothing.
  schedule:
    - cron: "0 6 * * 1,4"
  # On main, releases whatever version is not yet released: how a failed
  # release is retried.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A pull request's newer push cancels its older run; on main, a newer push
# cancels an older one that releases nothing. A run that may release is in a
# group of its own and is never cancelled, and nor is a manual run, which is
# how a failed release is retried. The group is chosen before any job runs, so
# it cannot ask `changes`. A push may release when its head commit is titled
# `release: ` (as `just release` names its pull request) or changes
# `Cargo.toml`: the second catches a version bump merged under any other
# title, at the cost of also keeping a dependency change from being cancelled.
concurrency:
  group: "ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || (startsWith(github.event.head_commit.message, 'release: ') || contains(github.event.head_commit.modified, 'Cargo.toml')) && format('release-{0}', github.sha) || 'main' }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'release: ') && !contains(github.event.head_commit.modified, 'Cargo.toml')) }}"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      grammar: ${{ steps.filter.outputs.grammar }}
      extension: ${{ steps.filter.outputs.extension }}
      vendor: ${{ steps.filter.outputs.vendor }}
      changelog: ${{ steps.filter.outputs.changelog }}
      workflows: ${{ steps.filter.outputs.workflows }}
      deps: ${{ steps.filter.outputs.deps }}
      release: ${{ steps.filter.outputs.release }}
      version: ${{ steps.filter.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        # The domains a change touches, from its diff: a pull request's against
        # its base, a push's against the last commit on main whose run passed,
        # so a push whose run the next one cancelled is still checked. A manual
        # or scheduled run, or a diff that cannot be worked out, runs
        # everything.
        #
        # Allowlists, so the question is "did any source of this domain
        # change?". The cost is that a new top-level directory of code is
        # invisible here until it is added below. Markdown is documentation
        # wherever it sits, except to the changelog, whose fragments are
        # Markdown.
        #
        # Steps run under `bash -e`, where grep finding nothing is a failing
        # command rather than an answer, so every question is asked in a
        # condition.
        run: |
          rust=true grammar=true extension=true vendor=true changelog=true workflows=true deps=true release=false
          # The workspace version, which every other version file follows
          # (scripts/versions.py).
          version_of() { sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' | head -1; }
          base=HEAD^1
          if [ "$EVENT" = "push" ]; then
            base=
            passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yml --branch main --event push \
              --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            if [ "$passed" = "$(git rev-parse HEAD)" ]; then
              base=HEAD^1
            elif [ -n "$passed" ] && git fetch -q --deepen=200 origin main && git merge-base --is-ancestor "$passed" HEAD; then
              base=$passed
            else
              echo "::notice::no passed run on main within reach -- running everything"
            fi
          fi
          # Whether this run releases, the one answer every release job reads.
          # A pull request: a release PR (branch `release-v*`, or a version
          # change), which builds everything and publishes nothing. A push to
          # main: it changes the version (against the commit before, not the
          # diff base) and that version is not out yet, so a push landing while
          # a release runs does not release that version a second time. A
          # manual run on main, which is how a failed release is retried:
          # whatever version is not out yet. Releases rather than tags are the
          # record of what has shipped, since the extension downloads from them.
          version=$(version_of < Cargo.toml)
          bumped=false
          if [ "$(git show HEAD^1:Cargo.toml 2>/dev/null | version_of)" != "$version" ]; then
            bumped=true
          fi
          case "$EVENT" in
            pull_request)
              case "$HEAD_REF" in release-v*) bumped=true ;; esac
              release=$bumped
              ;;
            push|workflow_dispatch)
              # Only a 404 means the version is not out. Any other failure
              # stops the run: guessing either way releases twice or never.
              if [ "$REF" = refs/heads/main ] && { [ "$EVENT" = workflow_dispatch ] || [ "$bumped" = true ]; }; then
                if ! out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1); then
                  if [ "$(grep -c 'HTTP 404' <<< "$out")" -gt 0 ]; then
                    release=true
                  else
                    echo "::error::cannot tell whether v$version is released: $out"
                    exit 1
                  fi
                fi
              fi
              ;;
          esac
          touches() { [ "$(grep -E "$1" <<< "$files" | grep -cvE '\.md$')" -gt 0 ]; }
          if [ "$release" = true ]; then
            echo "a release -- running everything"
          elif { [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; } && [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD); then
            echo "changes since $(git rev-parse --short "$base"):"
            printf '%s\n' "$files" | sed 's/^/  /'
            # Anything cargo compiles or that decides how, including the
            # vendored generator and the grammar's crate, whose tests read
            # askama's vendored test suite.
            touches '^crates/|^grammar/|^vendor/|^Cargo\.(toml|lock)$|^\.cargo/|^\.github/' || rust=false
            # The grammar, the Zed extension's queries over it, and the
            # askama test suite the grammar is held to.
            touches '^grammar/|^editors/zed/|^vendor/askama-testing/|^scripts/vendor-askama-testing\.py$|^mise\.toml$|^\.github/' || grammar=false
            # The extension's Rust code, built as Zed builds it.
            touches '^editors/zed/|^\.github/' || extension=false
            # The vendored generator must stay upstream's release plus our
            # patch, and its version follows the parser pin in Cargo.toml.
            touches '^vendor/|^scripts/vendor-askama\.py$|^Cargo\.toml$|^\.github/' || vendor=false
            touches '^\.github/(workflows|actions)/' || workflows=false
            # A new advisory can land on any day against an unchanged
            # lockfile, so main audits every push; a pull request only when it
            # changes what is resolved or how the audit reads it.
            if [ "$EVENT" = "pull_request" ]; then
              touches '^Cargo\.lock$|Cargo\.toml$|^\.cargo/|^\.github/' || deps=false
            fi
            [ "$(grep -cE '^changelog\.d/|^CHANGELOG\.md$|^scripts/(test_)?changelog\.py$|^\.github/' <<< "$files")" -gt 0 ] || changelog=false
          fi
          {
            echo "rust=$rust"
            echo "grammar=$grammar"
            echo "extension=$extension"
            echo "vendor=$vendor"
            echo "changelog=$changelog"
            echo "workflows=$workflows"
            echo "deps=$deps"
            echo "release=$release"
            echo "version=$version"
          } | tee -a "$GITHUB_OUTPUT"

  # Formatting, clippy over every target with warnings as errors, and the
  # tests: what `just check` runs. Each step runs however an earlier one went,
  # so one push reports every failure.
  check:
    name: Check
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - id: cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: check
          # A branch's cache helps no other branch and evicts main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Check formatting
        # The workspace's own crates; `--all` would also format the vendored
        # askama_derive, which must stay as upstream and its patch left it.
        run: cargo fmt -- --check
      - name: Clippy
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo test --workspace --locked

  # The grammar as Zed builds it. Zed compiles grammar/src from the repository
  # at the `rev` the extension pins, never generating it, so the generated
  # parser must be what grammar.js makes and the pinned commit must hold the
  # same grammar/src as this one. The corpus tests and every query the
  # extension ships are checked against the grammar, and the vendored askama
  # test suite (which the grammar crate's differential test reads in Check)
  # must be askama's own.
  grammar:
    name: Grammar
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.grammar == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The extension's pinned grammar commit is compared with this one.
          fetch-depth: 0
      # tree-sitter at the version mise.toml pins, which decides the generated parser.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: tree-sitter
      - name: Generated parser is fresh
        working-directory: grammar
        run: |
          tree-sitter generate
          if ! git diff --exit-code -- src; then
            echo "::error::grammar/src is stale; run \`tree-sitter generate\` in grammar/ and commit it"
            exit 1
          fi
      - name: Corpus
        working-directory: grammar
        run: tree-sitter test
      - name: Queries compile against the grammar
        working-directory: grammar
        run: |
          for query in ../editors/zed/languages/*/*.scm; do
            tree-sitter query "$query" ../vendor/askama-testing/templates/attr.html > /dev/null
          done
      - name: Pinned grammar matches
        run: |
          rev=$(sed -n 's/^rev = "\(.*\)"/\1/p' editors/zed/extension.toml)
          if ! git diff --quiet "$rev" HEAD -- grammar/src; then
            echo "::error::editors/zed/extension.toml pins grammar rev $rev, whose grammar/src differs from this commit's; pin a pushed commit that holds this grammar"
            exit 1
          fi
      - name: Vendored askama test suite is askama's
        run: python3 scripts/vendor-askama-testing.py --check

  # The Zed extension's Rust code as Zed's builder compiles it: for
  # wasm32-wasip2, in release, inside editors/zed, which is a workspace of its
  # own with its own lockfile. Clippy covers the wasm build and the host build
  # its unit tests run on; the tests cover what does not need Zed (platforms to
  # archive names, how the options are merged).
  extension:
    name: Extension
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/zed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - id: cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: editors/zed
          shared-key: extension
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --target wasm32-wasip2 -- -D warnings
      - name: Run tests
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo test --locked
      - name: Build for Zed
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo build --locked --release --target wasm32-wasip2

  # The server, the grammar and the extension release at one version, and the
  # registry reads the extension's. Seconds, so every run checks it.
  versions:
    name: Versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/versions.py

  # vendor/askama_derive must be askama_derive at the version Cargo.toml pins
  # askama_parser to, with vendor/askama_derive-tooling.patch applied and
  # nothing else: an edit made there by hand would be lost at the next
  # re-vendoring, and a patch that stops applying to a new release must fail
  # here rather than ship half applied.
  vendor:
    name: Vendored generator
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.vendor == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/vendor-askama.py --check

  # CHANGELOG.md is generated from changelog.d/ (scripts/changelog.py). A pull
  # request adds fragments without regenerating it, so only its fragments and
  # the released versions are checked; one that writes CHANGELOG.md, as a
  # release does, must write exactly what the fragments make.
  changelog:
    name: Changelog
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.changelog == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 -m unittest scripts/test_changelog.py
      - env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && git diff --name-only HEAD^1 HEAD | grep -qx CHANGELOG.md; then
            python3 scripts/changelog.py --check
          else
            python3 scripts/changelog.py --lint
          fi

  actionlint:
    name: Actionlint
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image bundles shellcheck, which checks the `run:` scripts.
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  # Blocking: cargo-audit's exit code is the gate. An advisory already in the
  # lockfile is acknowledged in .cargo/audit.toml with why it does not reach
  # this build, so this fails on anything new.
  audit:
    name: Security audit
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo install cargo-audit --locked --version 0.23.0
      - run: cargo audit

  # A release cancels this repository's pull request runs, which are re-run
  # from their page or by the next push, and main's non-release runs on
  # commits before it, which the release supersedes, so the release's builds
  # find runners free. Runs on later commits carry changes the release does
  # not, and a push that changes Cargo.toml may itself release (the
  # concurrency rule above), so both are left alone. Best effort: a run it
  # cannot list, compare or cancel only waits longer for a runner. A job of its
  # own, so only it holds a token that can cancel runs.
  make-room:
    name: Make room for the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: changes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.release == 'true'
    permissions:
      actions: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.run_id }}
        run: |
          for status in requested queued pending waiting in_progress; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yml --status "$status" --limit 100 \
              --json databaseId,event,headBranch,headSha,displayTitle \
              --jq '.[] | select(.event == "pull_request" or (.event == "push" and .headBranch == "main" and (.displayTitle | startswith("release: ") | not))) | "\(.databaseId) \(.event) \(.headSha)"' || true
          done | sort -u | while read -r id event sha; do
            [ "$id" = "$SELF" ] && continue
            if [ "$event" = push ]; then
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$GITHUB_SHA" --jq .status || true)
              [ "$status" = ahead ] || continue
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.files[].filename' || echo Cargo.toml)
              [ "$(grep -cx Cargo.toml <<< "$files")" -eq 0 ] || continue
            fi
            echo "cancelling run $id"
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done

  # askama-analyzer for every platform the extension downloads it on, each on
  # a native runner (both Apple targets on Apple silicon, where x86_64 is a
  # cross-compile Xcode supports). Linux builds are static musl binaries, so
  # one archive runs on any distribution. Archive names are the contract with
  # the extension (editors/zed/src/lib.rs, `server_asset`): the tarballs hold
  # `askama-analyzer` at their root, the zips `askama-analyzer.exe`.
  #
  # Check covers the code on Linux, so only a release, a release pull request
  # (which builds unsigned, so a broken platform fails before the version
  # merges rather than half way through publishing) and the schedule (these
  # runners' only cache, which would otherwise always have expired by the next
  # release) take these runners. A release signs and notarises the macOS
  # binaries, so they run from a browser download without clearing
  # quarantine; the notarise action fails when its secrets are missing rather
  # than letting an unsigned binary ship. Started by `changes` rather than
  # after `Checks`: these are the longest jobs, and publish nothing.
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: [changes, make-room]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.release == 'true' || github.event_name == 'schedule') }}
    strategy:
      # A transient failure on one platform should not cancel the others.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    env:
      TARGET: ${{ matrix.target }}
      SHIP: ${{ github.event_name != 'pull_request' && needs.changes.outputs.release == 'true' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: build-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --release --locked -p askama-analyzer --target "$TARGET"
      - name: Sign and notarise
        if: env.SHIP == 'true' && contains(matrix.target, 'apple-darwin')
        uses: radiosilence/blit-workflows/macos-notarise@c8a650dfa5a0fbe012c61eab28f615c1983aee18
        with:
          binaries: |
            target/${{ matrix.target }}/release/askama-analyzer
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
      # Archived, because an artifact does not keep the executable bit; the
      # archive is the release's download as it stands.
      - name: Archive
        if: env.SHIP == 'true'
        run: |
          case "$TARGET" in
            *-windows-*) pwsh -NoProfile -Command "Compress-Archive -Path target/$TARGET/release/askama-analyzer.exe -DestinationPath askama-analyzer-$TARGET.zip" ;;
            *) tar -czvf "askama-analyzer-$TARGET.tar.gz" -C "target/$TARGET/release" askama-analyzer ;;
          esac
      # Kept long enough for a late re-run of a failed publish to find them.
      - if: env.SHIP == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: askama-analyzer-${{ matrix.target }}
          path: askama-analyzer-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 90

  # The one status the ruleset requires. Skipped jobs are domains the change
  # does not touch and pass; anything failed or cancelled fails it.
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, check, grammar, extension, versions, vendor, changelog, actionlint, audit, make-room, build]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$bad" ]; then
            echo "::error::not passed: ${bad//$'\n'/ }"
            exit 1
          fi

  # ── CD ──────────────────────────────────────────────────────────────────
  #
  # Main only, after `Checks`. `checks` runs whatever its needs did, so every
  # job here states the results it depends on rather than relying on the
  # default, which would skip it whenever any job upstream was skipped.

  # The GitHub release, which is what the extension downloads from: every
  # archive, SHA256SUMS over them, and a build provenance attestation for each
  # (`gh attestation verify <archive> --repo radiosilence/zed-askama`). The
  # action creates the tag through the API, on the commit that was built:
  # GitHub refuses a git push of it from the workflow token for any commit that
  # changes a workflow. A re-run finds the release and tag and fills in what is
  # missing; a missing token, archive or changelog section fails rather than
  # releasing something else.
  publish-release:
    name: GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes, checks, build]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.result == 'success' && needs.checks.result == 'success' && needs.build.result == 'success' && needs.changes.outputs.release == 'true' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - name: Check the release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; v$VERSION cannot be released"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: askama-analyzer-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          count=$(find . -maxdepth 1 \( -name 'askama-analyzer-*.tar.gz' -o -name 'askama-analyzer-*.zip' \) | wc -l)
          if [ "$count" -ne 6 ]; then
            echo "::error::expected 6 archives, found $count"
            ls -l
            exit 1
          fi
          sha256sum askama-analyzer-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/askama-analyzer-*
      - name: Release notes
        run: |
          awk -v h="## $VERSION" '$0==h{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q . "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/askama-analyzer-*
            artifacts/SHA256SUMS

  # The version bump on zed-industries/extensions, opened as a draft from a
  # fork in the user's account (scripts/registry-pr.sh). It stays a draft until
  # a person has tried this release in Zed; nothing here marks it ready.
  # Without ZED_EXTENSIONS_TOKEN it opens nothing and says so. The first
  # submission, which adds the submodule, is made by hand (docs/releasing.md).
  registry:
    name: Zed extensions registry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes, publish-release]
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      GH_TOKEN: ${{ secrets.ZED_EXTENSIONS_TOKEN }}
    steps:
      - name: Check the registry token
        id: token
        run: |
          if [ -n "$GH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ZED_EXTENSIONS_TOKEN is not set; open the zed-industries/extensions pull request for v$VERSION by hand (docs/releasing.md)."
          fi
      - if: steps.token.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.token.outputs.ready == 'true'
        run: scripts/registry-pr.sh "$VERSION" "$GITHUB_SHA"
